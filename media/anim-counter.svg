<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 218" width="860" height="218" role="img" aria-labelledby="t d">
<title id="t">Mycel headline numbers</title><desc id="d">Four measured results: minus 94 percent tool definitions with 8 servers, 204k to 1.2k tokens with 414 tools, 131k to 187 tokens for a 20,000-row CSV, and 17 tool calls in 1 round trip with Code Mode (not yet measured with a live model). The 414-tool figure is tool-definition tokens measured in a local lab, not yet reproducible from the repo.</desc>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#E6F2EC}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.dim{fill:#7E968B}.g{fill:#3DFFB0}.r{fill:#FF6B5B}.b{font-weight:700}
.fb{transform-box:fill-box;transform-origin:left center}.fc{transform-box:fill-box;transform-origin:center}
.tl0{animation:k_tl0 10.0s linear infinite;}@keyframes k_tl0{0%{opacity:0;transform:translateY(16px)}4.0%{opacity:0;transform:translateY(16px)}9.0%{opacity:1;transform:translateY(0)}92.0%{opacity:1;transform:translateY(0)}97.0%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.st0{animation:k_st0 10.0s linear infinite;}@keyframes k_st0{0%{opacity:0}5.0%{opacity:0}5.2%{opacity:1}8.0%{opacity:1}8.2%{opacity:0}100%{opacity:0}}
.st1{animation:k_st1 10.0s linear infinite;}@keyframes k_st1{0%{opacity:0}8.0%{opacity:0}8.2%{opacity:1}11.0%{opacity:1}11.2%{opacity:0}100%{opacity:0}}
.st2{animation:k_st2 10.0s linear infinite;}@keyframes k_st2{0%{opacity:0}11.0%{opacity:0}11.2%{opacity:1}92.0%{opacity:1}92.2%{opacity:0}100%{opacity:0}}
.tl1{animation:k_tl1 10.0s linear infinite;}@keyframes k_tl1{0%{opacity:0;transform:translateY(16px)}13.0%{opacity:0;transform:translateY(16px)}18.0%{opacity:1;transform:translateY(0)}92.0%{opacity:1;transform:translateY(0)}97.0%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.tl2{animation:k_tl2 10.0s linear infinite;}@keyframes k_tl2{0%{opacity:0;transform:translateY(16px)}22.0%{opacity:0;transform:translateY(16px)}27.0%{opacity:1;transform:translateY(0)}92.0%{opacity:1;transform:translateY(0)}97.0%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.tl3{animation:k_tl3 10.0s linear infinite;}@keyframes k_tl3{0%{opacity:0;transform:translateY(16px)}31.0%{opacity:0;transform:translateY(16px)}36.0%{opacity:1;transform:translateY(0)}92.0%{opacity:1;transform:translateY(0)}97.0%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
