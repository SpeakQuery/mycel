name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: node ${{ matrix.node-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node-version: 20 }
          - { os: ubuntu-latest, node-version: 22 }
          - { os: macos-latest, node-version: 22 }
          - { os: windows-latest, node-version: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install ffmpeg (optional; enables video/audio digests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js bench

  field-test:
    name: field test · 8 real MCP servers · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci && npm run build
      - name: Install the real MCP servers
        working-directory: examples/field-test
        run: npm install
      - name: Run the 10 checks
        working-directory: examples/field-test
        run: npm run setup && npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-test-${{ matrix.os }}
          path: examples/field-test/results.json

  full-scale:
    name: full scale · 15 servers, 420 tools (recorded) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Count tool-definition tokens, direct vs Mycel (offline replay)
        working-directory: examples/full-scale
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-scale-${{ matrix.os }}
          path: examples/full-scale/results.json

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Python client tests
        run: python -m unittest discover -s python/tests

  e2e:
    name: end to end · what a user does · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Setup, apps, search + call, savings, stats, undo, uninstall, and the Claude Desktop extension
        run: npm run e2e

  installer:
    name: installer · brings its own Node · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build && npm pack
      - name: install.sh in an empty home, forced Node download, this build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          T=$(mktemp -d); mkdir -p "$T/home"
          PKG="$PWD/$(ls speakquery-mycel-*.tgz)"
          env -i HOME="$T/home" SHELL=/bin/bash PATH=/usr/bin:/bin:/usr/sbin:/sbin MYCEL_PACKAGE="$PKG" MYCEL_FORCE_NODE_DOWNLOAD=1 MYCEL_NO_UPDATE=1 sh site/install.sh </dev/null | tee "$T/out.txt"
          grep -q "checksum verified" "$T/out.txt"
          "$T/home/.mycel/bin/mycel" --version
          "$T/home/.mycel/bin/mycel" doctor || true
          grep -q ".mycel/bin" "$T/home/.bashrc" || grep -q ".mycel/bin" "$T/home/.bash_profile"
      - name: install.ps1 in an empty profile, forced Node download, this build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $T = Join-Path $env:RUNNER_TEMP "mycel-home"; New-Item -ItemType Directory -Force $T | Out-Null
          $pkg = (Get-ChildItem speakquery-mycel-*.tgz).FullName
          $env:MYCEL_HOME = Join-Path $T ".mycel"; $env:MYCEL_PACKAGE = $pkg; $env:MYCEL_FORCE_NODE_DOWNLOAD = "1"; $env:MYCEL_YES = "1"; $env:MYCEL_NO_UPDATE = "1"
          $env:USERPROFILE = $T; $env:APPDATA = Join-Path $T "AppData\Roaming"
          & ./site/install.ps1 --no-check *>&1 | Tee-Object -FilePath (Join-Path $T "out.txt")
          if (-not (Select-String -Path (Join-Path $T "out.txt") -Pattern "checksum verified" -Quiet)) { throw "node checksum line missing" }
          & (Join-Path $T ".mycel\bin\mycel.cmd") --version
          if ($LASTEXITCODE -ne 0) { throw "mycel.cmd failed" }
