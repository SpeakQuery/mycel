<text class="msg b" x="430" y="408" font-size="19" text-anchor="middle" style="fill:#FF6B5B">420 tools → 204k if the client sends them all (examples/full-scale).</text>
<text x="430" y="440" font-size="12" text-anchor="middle" class="dim">Measured with mycel bench and the 8-server field test. Each red block ≈ one server (8-server average, ≈2.2k tokens).</text>
