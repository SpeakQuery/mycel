<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" width="860" height="490" role="img" aria-labelledby="t d">
<title id="t">Context window: direct MCP versus Mycel</title><desc id="d">Animation of a 200k-token context window. Adding servers one by one fills the direct bar with red blocks up to 17.8k tokens for 8 servers, while Mycel stays a thin 1k slice. A heavy setup of 15 servers and 420 tools needs about 204k tokens, filling the window, versus about 1.2k through Mycel. Reproducible offline from examples/full-scale. Applies to clients that send every definition each turn.</desc>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#E6F2EC}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.dim{fill:#7E968B}.g{fill:#3DFFB0}.r{fill:#FF6B5B}.b{font-weight:700}
.fb{transform-box:fill-box;transform-origin:left center}.fc{transform-box:fill-box;transform-origin:center}
