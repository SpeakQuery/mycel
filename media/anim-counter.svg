<rect width="860" height="218" rx="14" fill="#07110D"/>
<g class="tl0"><rect x="20" y="20" width="195" height="150" rx="12" fill="#10231A" stroke="#1C3A2D"/><rect x="20" y="20" width="195" height="4" rx="2" fill="#3DFFB0"/>
<text class="st0 g b" x="117.5" y="92" font-size="44" text-anchor="middle" style="opacity:0">−19%</text>
<text class="st1 g b" x="117.5" y="92" font-size="44" text-anchor="middle" style="opacity:0">−86%</text>
