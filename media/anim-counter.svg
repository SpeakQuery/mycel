<text x="117.5" y="124" font-size="16" text-anchor="middle" class="b">8 servers</text><text x="117.5" y="146" font-size="12" text-anchor="middle" class="dim">tool definitions in context</text></g>
<g class="tl1"><rect x="235" y="20" width="195" height="150" rx="12" fill="#10231A" stroke="#1C3A2D"/><rect x="235" y="20" width="195" height="4" rx="2" fill="#3DFFB0"/>
<text class="g b" x="332.5" y="92" font-size="27" text-anchor="middle">204k → 1.2k</text>
<text x="332.5" y="124" font-size="16" text-anchor="middle" class="b">414 tools</text><text x="332.5" y="146" font-size="12" text-anchor="middle" class="dim">per turn, 15 servers</text></g>
<g class="tl2"><rect x="450" y="20" width="195" height="150" rx="12" fill="#10231A" stroke="#1C3A2D"/><rect x="450" y="20" width="195" height="4" rx="2" fill="#3DFFB0"/>
