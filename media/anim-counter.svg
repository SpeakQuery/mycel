<text class="g b" x="762.5" y="92" font-size="44" text-anchor="middle">17 → 1</text>
<text x="762.5" y="124" font-size="16" text-anchor="middle" class="b">calls → 1 round trip</text><text x="762.5" y="146" font-size="12" text-anchor="middle" class="dim">Code Mode; no live model yet</text></g>
<text x="430" y="198" font-size="12" text-anchor="middle" class="dim">−94%: reproducible (examples/field-test) · 204k: local lab, tool-definition tokens · overhead ~+0.4 ms Mac, +1 ms CI</text>
