<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- Every number on screen comes from data.json (synced into assets/data.js). -->
    <script src="assets/data.js"></script>
    <script src="assets/lib.js"></script>
    <style>
      :root {
        --ground: #07110d;
        --panel: #0c1c16;
        --line: #1c3a2e;
        --ink: #e8f5ee;
        --muted: #8fb3a3;
        --accent: #3dffb0;
        --amber: #ffb547;
        --font-display: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--ground); color: var(--ink); font-family: var(--font-display);
      }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="90" data-width="1920" data-height="1080">
      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html"
        data-start="0" data-duration="90" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:0"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="problem" data-composition-id="problem" data-composition-src="compositions/problem.html"
        data-start="8" data-duration="17" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
        data-start="25" data-duration="7" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="arch" data-composition-id="arch" data-composition-src="compositions/arch.html"
        data-start="32" data-duration="12" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html"
        data-start="44" data-duration="16" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="montage" data-composition-id="montage" data-composition-src="compositions/montage.html"
        data-start="60" data-duration="18" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="78" data-duration="12" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:2"></div>
      <audio id="bed" class="clip" src="assets/ambient.m4a" data-start="0" data-duration="90"
        data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
