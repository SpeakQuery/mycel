  <script>
    (function () {
      const D = window.MY.D;
      const imports = D.imports || [];
      const pad = (s, n) => (s + " ".repeat(n)).slice(0, n);
      const outs = ["ct-o1", "ct-o2", "ct-o3"];
      outs.forEach((id, i) => {
        const im = imports[i];
        const el = document.getElementById(id);
        if (im) el.innerHTML = '<span class="ok">✔</span> Found ' + pad(im.client, 16) + "(" + im.servers + " servers)";
      });
      const names = imports.map((x) => x.client.replace(" Desktop", "")).join(", ");
      document.getElementById("ct-imp").innerHTML = '<span class="ok" style="color:#3dffb0">✔</span> Imported <span class="n">' + D.importedTotal + "</span> servers from " + names;
      document.getElementById("ct-o5").innerHTML = "→ mycel serve · dashboard on localhost:" + D.dashboardPort;

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ct-term", { opacity: 0, y: 40, scale: 0.96, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0.1);
      // Typing, one character per 0.08 s.
      const cmd = "npx mycel init", typed = document.getElementById("ct-typed");
      for (let i = 0; i <= cmd.length; i++) tl.set(typed, { textContent: cmd.slice(0, i) }, 0.6 + i * 0.08);
      tl.fromTo("#ct-caret", { opacity: 1 }, { opacity: 0, duration: 0.01, repeat: 9, yoyo: true, repeatDelay: 0.4 }, 0.2);
      tl.set("#ct-caret", { opacity: 0 }, 2.0);
      const T = [2.2, 2.6, 3.0, 3.6, 4.3];
      ["#ct-o1", "#ct-o2", "#ct-o3", "#ct-imp", "#ct-o5"].forEach((s, i) => tl.fromTo(s, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, T[i]));
      tl.fromTo("#ct-imp", { backgroundColor: "rgba(61,255,176,0.18)" }, { backgroundColor: "rgba(61,255,176,0)", duration: 1.2 }, 3.7);
      // End card.
      tl.to("#ct-term", { opacity: 0, y: -60, scale: 0.92, filter: "blur(10px)", duration: 0.45, ease: "power3.in" }, 6.0);
      tl.fromTo("#ct-mark", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, 6.4);
      tl.fromTo("#ct-word", { opacity: 0, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, 6.7);
      tl.fromTo("#ct-tag", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, 7.3);
      tl.fromTo("#ct-pill", { opacity: 0, scale: 0.9, xPercent: -50 }, { opacity: 1, scale: 1, xPercent: -50, duration: 0.45, ease: "expo.out" }, 7.8);
      tl.fromTo("#ct-foot", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 8.3);
      window.__timelines["cta"] = tl;
    })();
