  <script>
    (function () {
      const D = window.MY.D;
      window.MY.fill(document.querySelector('[data-composition-id="proof"]'));
      // A: one chip per direct tool, sized to fill the panel body.
      const grid = document.getElementById("pfa-grid");
      const n = Number(D.toolsDirect) || 180, W = 700, H = 470, gap = 6;
      const cols = Math.max(1, Math.ceil(Math.sqrt((n * W) / H)));
      const rows = Math.ceil(n / cols);
      const cw = (W - gap * (cols - 1)) / cols, ch = Math.min(cw, (H - gap * (rows - 1)) / rows);
      for (let i = 0; i < n; i++) { const c = document.createElement("div"); c.className = "pfa-chip"; c.style.width = cw + "px"; c.style.height = ch + "px"; grid.appendChild(c); }
      // B: hex flood.
      const R = window.MY.rng(99), hx = "0123456789abcdef";
      let s = ""; for (let i = 0; i < 1500; i++) { s += hx[Math.floor(R() * 16)] + hx[Math.floor(R() * 16)] + (i % 2 ? " " : ""); }
      document.getElementById("pfb-hex").textContent = s;
      // C: one row per direct round trip.
      const rowsBox = document.getElementById("pfc-rows");
      const rt = Math.min(Number(D.roundTripsDirect) || 10, 14);
      const rh = Math.min(46, 470 / rt);
      for (let i = 0; i < rt; i++) {
        const r = document.createElement("div"); r.className = "pfc-row"; r.style.height = rh + "px";
        r.innerHTML = '<span class="ep">model</span><span class="ln"><span class="dt"></span></span><span class="ep">tools</span><span style="width:110px;text-align:right">turn ' + (i + 1) + "</span>";
        rowsBox.appendChild(r);
      }
      const tl = gsap.timeline({ paused: true });
      const segIn = (id, t) => {
        tl.fromTo(id + " .pf-title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, t + 0.1);
        tl.fromTo(id + " .pf-L", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, t + 0.25);
        tl.fromTo(id + " .pf-arrow", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t + 1.7);
        tl.fromTo(id + " .pf-R", { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, t + 1.85);
      };
      const segOut = (id, t) => tl.to(id + "-in", { opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, t);
      // A
      segIn("#pfa", 0);
      tl.fromTo(".pfa-chip", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.2, stagger: { each: 0.9 / n, from: "start" }, ease: "power2.out" }, 0.45);
      tl.fromTo(".pfa-mt", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.07, ease: "expo.out" }, 2.1);
      tl.fromTo("#pfa-save", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 3.0);
      segOut("#pfa", 5.05);
      // B
      segIn("#pfb", 5.4);
      tl.fromTo("#pfb-hex", { y: 0 }, { y: -900, duration: 4.6, ease: "none" }, 5.6);
      tl.fromTo("#pfb-stamp", { opacity: 0, scale: 1.4, xPercent: -50, yPercent: -50 }, { opacity: 1, scale: 1, xPercent: -50, yPercent: -50, duration: 0.3, ease: "expo.out" }, 6.6);
      tl.fromTo("#pfb-ref", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3 }, 7.4);
      tl.fromTo("#pfb-meta", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.7);
      tl.fromTo(".pfb-k", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.1, ease: "expo.out" }, 7.9);
      tl.fromTo("#pfb-tr > div", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.15 }, 8.4);
      segOut("#pfb", 10.45);
      // C
      segIn("#pfc", 10.8);
      const dots = document.querySelectorAll(".pfc-row .dt");
      dots.forEach((d, i) => {
        tl.fromTo(d, { x: 0, opacity: 0 }, { x: 370, opacity: 1, duration: 0.18, ease: "power1.inOut", yoyo: true, repeat: 1 }, 11.1 + i * 0.16);
      });
      tl.fromTo(".pfc-row", { opacity: 0.25 }, { opacity: 1, duration: 0.1, stagger: 0.16 }, 11.1);
      tl.fromTo("#pfc-code", { opacity: 0, clipPath: "inset(0 0 100% 0)" }, { opacity: 1, clipPath: "inset(0 0 0% 0)", duration: 0.9, ease: "power2.out" }, 12.8);
      tl.fromTo("#pfc-run", { opacity: 0, scaleX: 0.5, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "expo.out" }, 13.8);
      tl.to("#pfc-in", { opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 15.65);
      window.__timelines["proof"] = tl;
    })();
